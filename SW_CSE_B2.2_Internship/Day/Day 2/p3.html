<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered List</title>
</head>
<body>
   <P>Unordered List and group related items for better readability</P>
   <!-- ul: unordered list | li: list | items are listed with bullets  -->
   <ul>
      <li>Apple</li>
      <li>Banana</li>
      <li>Orange</li>
   </ul>

   <p>Ordered List: ol :list the items by numbering them </p>
   <ol>
      <li>Laptop</li>
      <li>phone</li>
      <li>ipad</li>
   </ol>
</body>
</html>
